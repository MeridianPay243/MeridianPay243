services:
  - type: web
    name: meridian-pay
    env: node
    plan: free
    buildCommand: yarn install
    startCommand: node --no-deprecation server.js
    envVars:
      - key: CHECKBOOK_ENV
        value: sandbox
      - key: BRAND_NAME
        value: Meridian Pay
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: efugduhfr@gmail.com
      - key: FROM_EMAIL
        value: efugduhfr@gmail.com
      - key: ADMIN_EMAIL
        value: Koaa0@hotmail.com
